name: Backend CI

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, master, develop]
    paths:
      - "backend/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "[BE] Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - run: npm run lint
        working-directory: ./backend

  typecheck:
    name: "[BE] Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - run: npm run typecheck
        working-directory: ./backend

  test:
    name: "[BE] Tests"
    runs-on: ubuntu-latest
    env:
      COOKIE_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CSRF_SECRET: "test-csrf-secret-for-ci-only"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - run: npm test
        working-directory: ./backend

  build:
    name: "[BE] Build"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - run: npm run build
        working-directory: ./backend

  audit:
    name: "[BE] Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=moderate
        working-directory: ./backend
        continue-on-error: true

  ci:
    name: "[Backend] CI"
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, test, build, audit]
    steps:
      - name: Verify all checks passed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " Backend CI Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Lint:       ${{ needs.lint.result }}"
          echo "  Typecheck:  ${{ needs.typecheck.result }}"
          echo "  Tests:      ${{ needs.test.result }}"
          echo "  Build:      ${{ needs.build.result }}"
          echo "  Audit:      ${{ needs.audit.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo ""
            echo "One or more checks failed."
            exit 1
          fi

          echo ""
          echo "All checks passed."
